name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the use case. How does the original CE42 handle it, if at all?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
